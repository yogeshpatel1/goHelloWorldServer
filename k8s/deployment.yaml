apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-hello-world
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-hello-world
  template:
    metadata:
      labels:
        app: go-hello-world
    spec:
      imagePullSecrets:
        - name: dockerhub-creds
      containers:
        - name: go-hello-world
          image: {{.Values.image}}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: go-hello-world
spec:
  selector:
    app: go-hello-world
  ports:
    - port: 80
      targetPort: 80
